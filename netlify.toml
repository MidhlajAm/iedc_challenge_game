# Netlify settings for IEDC Rush.
# Plain HTML/JS served straight from the repo root. The only "build" step
# writes js/firebase-config.js from environment variables (set them in
# Netlify → Site configuration → Environment variables), because that file
# is gitignored. Plain Node, no npm install.

[build]
  publish = "."
  command = "node tools/write-firebase-config.js"

# Phones must always check for the latest game files, so a fix pushed on
# event day reaches players on their next reload instead of a stale copy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Planning notes live in the repo but shouldn't be public pages.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/PLAN.md"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/not-found"
  status = 404
  force = true
