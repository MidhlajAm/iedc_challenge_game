# Netlify settings for IEDC Rush.
#
# The build step (tools/build.js) copies the site into dist/ and minifies
# the JavaScript, so the published code carries no comments and short
# variable names while the repo keeps readable source. It also writes
# js/firebase-config.js from the environment variables set in
# Netlify → Site configuration → Environment variables.

[build]
  publish = "dist"
  command = "npm run build"

# Phones must always check for the latest game files, so a fix pushed on
# event day reaches players on their next reload instead of a stale copy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Only the files build.js copies are published, so planning notes, build
# scripts and .env are never part of the deployed site.
