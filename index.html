<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No pinch-zoom, fit to the device width -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d2b52">
  <!-- Icons -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <!-- Menu typefaces (the game itself doesn't wait for these) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
  <!-- Full screen when added to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>IEDC Rush</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;              /* no page scroll */
      background: #111111;
      overscroll-behavior: none;     /* no pull-to-refresh / bounce */
      touch-action: none;            /* no browser gestures on the page */
      -webkit-user-select: none;
      user-select: none;             /* no text selection on long-press */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      position: fixed;               /* stops iOS rubber-band scrolling */
      inset: 0;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }

    /* Portrait only: on a phone held sideways, cover the game */
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #0d1117;
      color: #ffffff;
      font: bold 22px "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #rotate .phone {
      width: 44px;
      height: 76px;
      border: 4px solid #ffd54f;
      border-radius: 10px;
    }
    /* Short + landscape = a phone on its side (desktop windows are taller) */
    @media (orientation: landscape) and (max-height: 540px) {
      #rotate { display: flex; }
    }

    [hidden] { display: none !important; }

    /* First-visit name entry (shown once; see js/online/player.js) */
    #name-entry {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(13, 17, 23, 0.72);
      font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
    }
    #name-form {
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
      padding: 24px 22px 22px;
      border-radius: 20px;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      text-align: center;
    }
    #name-form picture img {
      display: block;
      width: 150px;
      max-width: 60%;
      height: auto;
      margin: 0 auto 14px;
      border-radius: 10px;
      background: #ffffff;
      padding: 6px 10px;
    }
    #name-form h1 {
      margin: 0 0 4px;
      font-size: 28px;
      color: #ffd54f;
    }
    #name-form p {
      margin: 0 0 16px;
      font-size: 15px;
      color: #9fb3c8;
    }
    #name-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid #30363d;
      background: #0d1117;
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;               /* 16px+ stops iOS zooming in on focus */
      font-family: inherit;
      text-align: center;
      outline: none;
      -webkit-user-select: text;     /* the page blocks selection; inputs need it */
      user-select: text;
      touch-action: manipulation;
    }
    #name-input:focus { border-color: #2f81f7; }
    #name-error {
      min-height: 20px;
      margin: 8px 0 10px !important;
      color: #ff7b72 !important;
      font-size: 14px !important;
    }
    #name-form button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 28px;
      background: #2ea043;
      color: #ffffff;
      font-weight: bold;
      font-size: 20px;
      font-family: inherit;
      letter-spacing: 1px;
      touch-action: manipulation;
    }

    /* ------------------------------------------------------------
       Intro and settings screens (see js/ui/menu.js)
       ------------------------------------------------------------ */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      font-family: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 500;
      color: #f2f2f2;
    }
    .screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
    /* The live game scene stays visible behind the intro, dimmed toward the bottom */
    #intro {
      align-items: flex-end;
      padding-bottom: calc(36px + env(safe-area-inset-bottom));
      background: linear-gradient(rgba(13, 43, 82, 0) 18%, rgba(13, 43, 82, 0.55) 52%, rgba(13, 43, 82, 0.96) 80%);
    }
    .intro {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .intro picture img {
      display: block;
      width: 132px;
      height: auto;
      margin: 0 auto 10px;
      padding: 5px 9px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .intro h1 {
      margin: 0;
      font-family: "Russo One", "Trebuchet MS", sans-serif;
      font-weight: 400;
      font-size: clamp(46px, 14vw, 64px);
      line-height: 1;
      color: #fdd835;
      text-shadow: 0 4px 0 #1f2127;
    }
    .tagline {
      margin: 8px 0 18px;
      font-size: 17px;
    }
    .player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 14px;
      border: 2px solid rgba(253, 216, 53, 0.55);
      border-radius: 10px;
      background: rgba(13, 43, 82, 0.85);
      text-align: left;
    }
    .player-name {
      min-width: 0;
      font-weight: 700;
      font-size: 19px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-name small {
      display: block;
      font-weight: 500;
      font-size: 13px;
      color: #a4a9b3;
    }
    .stats { display: flex; gap: 14px; }
    .stat { text-align: right; }
    .stat small { display: block; font-size: 13px; color: #a4a9b3; }
    .stat b {
      font-family: "Russo One", "Trebuchet MS", sans-serif;
      font-weight: 400;
      font-size: 22px;
      color: #fdd835;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      font-family: "Russo One", "Trebuchet MS", sans-serif;
      font-size: 20px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:focus-visible, .switch:focus-visible, .segmented button:focus-visible, .link:focus-visible {
      outline: 3px solid #fdd835;
      outline-offset: 3px;
    }
    .btn-play {
      margin-bottom: 10px;
      padding: 18px;
      font-size: 30px;
      background: #fdd835;
      color: #1f2127;
      box-shadow: 0 5px 0 #b59a00;
    }
    .btn-play:active { transform: translateY(4px); box-shadow: 0 1px 0 #b59a00; }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .btn-row .btn { padding: 17px 12px; }
    .btn-secondary {
      background: #0d2b52;
      color: #f2f2f2;
      border: 2px solid rgba(253, 216, 53, 0.6);
    }
    .howto {
      margin: 0;
      font-size: 14px;
      color: #cfd6df;
    }

    #settings { z-index: 18; background: rgba(13, 17, 23, 0.72); }
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 20px 18px 18px;
      border-top: 4px solid #fdd835;
      border-radius: 12px;
      background: #0d2b52;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .panel h2 {
      margin: 0 0 10px;
      font-family: "Russo One", "Trebuchet MS", sans-serif;
      font-weight: 400;
      font-size: 28px;
      color: #fdd835;
    }
    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 18px;
    }
    .setting:last-of-type { margin-bottom: 18px; }
    .switch {
      position: relative;
      flex: none;
      width: 58px;
      height: 32px;
      border: 0;
      border-radius: 16px;
      background: #3a3d44;
      cursor: pointer;
      touch-action: manipulation;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f2f2f2;
      transition: transform 0.15s ease-out;
    }
    .switch[aria-checked="true"] { background: #fdd835; }
    .switch[aria-checked="true"]::after { transform: translateX(26px); background: #1f2127; }
    .segmented {
      display: flex;
      padding: 3px;
      border-radius: 8px;
      background: #1f2127;
    }
    .segmented button {
      min-width: 70px;
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: #a4a9b3;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .segmented button[aria-pressed="true"] { background: #fdd835; color: #1f2127; }
    .link {
      min-width: 0;
      max-width: 55%;
      padding: 6px 0;
      border: 0;
      background: none;
      color: #fdd835;
      font: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    #name-cancel {
      margin-top: 10px;
      background: none;
      border: 0;
      color: #9fb3c8;
      font: inherit;
      font-size: 16px;
      text-decoration: underline;
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      .switch::after { transition: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Intro screen: shown when the page opens (not on restarts) -->
  <div id="intro" class="screen" hidden>
    <div class="intro">
      <picture>
        <source srcset="assets/mea-iedc-logo.webp" type="image/webp">
        <img src="assets/mea-iedc-logo.png" alt="MEA IEDC" width="192" height="94">
      </picture>
      <h1>IEDC Rush</h1>
      <p class="tagline">Dodge the traffic. Top the leaderboard.</p>

      <div id="intro-player" class="player" hidden>
        <span class="player-name"><small>Playing as</small><span id="intro-name"></span></span>
        <span class="stats">
          <span class="stat"><small>Best</small><b id="intro-best">-</b></span>
          <span class="stat"><small>Rank</small><b id="intro-rank">-</b></span>
        </span>
      </div>

      <button id="btn-play" class="btn btn-play" type="button">Play</button>
      <div class="btn-row">
        <a class="btn btn-secondary" href="leaderboard.html">Leaderboard</a>
        <button id="btn-settings" class="btn btn-secondary" type="button">Settings</button>
      </div>
      <p id="howto" class="howto">Tap the left or right side of the screen to change lanes</p>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="screen" hidden>
    <div class="panel" role="dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <div class="setting">
        <span id="label-sound">Sound effects</span>
        <button id="set-sound" class="switch" type="button" role="switch" aria-labelledby="label-sound"></button>
      </div>
      <div class="setting">
        <span id="label-music">Music</span>
        <button id="set-music" class="switch" type="button" role="switch" aria-labelledby="label-music"></button>
      </div>
      <div class="setting">
        <span>Controls</span>
        <span class="segmented">
          <button type="button" data-input="tap">Tap</button>
          <button type="button" data-input="swipe">Swipe</button>
        </span>
      </div>
      <button id="settings-done" class="btn btn-play" type="button">Done</button>
    </div>
  </div>

  <div id="name-entry" hidden>
    <form id="name-form" autocomplete="off" novalidate>
      <picture>
        <source srcset="assets/mea-iedc-logo.webp" type="image/webp">
        <img src="assets/mea-iedc-logo.png" alt="MEA IEDC" width="192" height="94">
      </picture>
      <h1>IEDC Rush</h1>
      <p>Enter your name for the leaderboard</p>
      <input id="name-input" type="text" name="player-name" placeholder="Your name"
             autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
      <p id="name-error" role="alert"></p>
      <button type="submit">PLAY</button>
      <button id="name-cancel" type="button" hidden>Cancel</button>
    </form>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <div>Rotate your phone<br>to play</div>
  </div>

  <script>
    // iOS Safari ignores user-scalable=no, so block pinch / double-tap
    // zoom, long-press menus and page dragging by hand.
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>

  <!-- Phaser 3, pinned version -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Game code: config first, then scenes, then boot -->
  <script src="js/config.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/music.js"></script>
  <!-- Online scores: config is generated/gitignored; the game runs fine without it -->
  <script src="js/firebase-config.js" onerror="window.FIREBASE_CONFIG = null"></script>
  <script src="js/online/player.js"></script>
  <script src="js/online/scores.js"></script>
  <script src="js/views/BackView.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
