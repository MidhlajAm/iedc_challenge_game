<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No pinch-zoom, fit to the device width -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <!-- Full screen when added to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>IEDC Rush</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;              /* no page scroll */
      background: #111111;
      overscroll-behavior: none;     /* no pull-to-refresh / bounce */
      touch-action: none;            /* no browser gestures on the page */
      -webkit-user-select: none;
      user-select: none;             /* no text selection on long-press */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      position: fixed;               /* stops iOS rubber-band scrolling */
      inset: 0;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }

    /* Portrait only: on a phone held sideways, cover the game */
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #0d1117;
      color: #ffffff;
      font: bold 22px "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #rotate .phone {
      width: 44px;
      height: 76px;
      border: 4px solid #ffd54f;
      border-radius: 10px;
    }
    /* Short + landscape = a phone on its side (desktop windows are taller) */
    @media (orientation: landscape) and (max-height: 540px) {
      #rotate { display: flex; }
    }

    [hidden] { display: none !important; }

    /* First-visit name entry (shown once; see js/online/player.js) */
    #name-entry {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(13, 17, 23, 0.72);
      font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
    }
    #name-form {
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
      padding: 24px 22px 22px;
      border-radius: 20px;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      text-align: center;
    }
    #name-form picture img {
      display: block;
      width: 150px;
      max-width: 60%;
      height: auto;
      margin: 0 auto 14px;
      border-radius: 10px;
      background: #ffffff;
      padding: 6px 10px;
    }
    #name-form h1 {
      margin: 0 0 4px;
      font-size: 28px;
      color: #ffd54f;
    }
    #name-form p {
      margin: 0 0 16px;
      font-size: 15px;
      color: #9fb3c8;
    }
    #name-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid #30363d;
      background: #0d1117;
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;               /* 16px+ stops iOS zooming in on focus */
      font-family: inherit;
      text-align: center;
      outline: none;
      -webkit-user-select: text;     /* the page blocks selection; inputs need it */
      user-select: text;
      touch-action: manipulation;
    }
    #name-input:focus { border-color: #2f81f7; }
    #name-error {
      min-height: 20px;
      margin: 8px 0 10px !important;
      color: #ff7b72 !important;
      font-size: 14px !important;
    }
    #name-form button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 28px;
      background: #2ea043;
      color: #ffffff;
      font-weight: bold;
      font-size: 20px;
      font-family: inherit;
      letter-spacing: 1px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="name-entry" hidden>
    <form id="name-form" autocomplete="off" novalidate>
      <picture>
        <source srcset="assets/mea-iedc-logo.webp" type="image/webp">
        <img src="assets/mea-iedc-logo.png" alt="MEA IEDC" width="192" height="94">
      </picture>
      <h1>IEDC Rush</h1>
      <p>Enter your name for the leaderboard</p>
      <input id="name-input" type="text" name="player-name" placeholder="Your name"
             autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
      <p id="name-error" role="alert"></p>
      <button type="submit">PLAY</button>
    </form>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <div>Rotate your phone<br>to play</div>
  </div>

  <script>
    // iOS Safari ignores user-scalable=no, so block pinch / double-tap
    // zoom, long-press menus and page dragging by hand.
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>

  <!-- Phaser 3, pinned version -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Game code: config first, then scenes, then boot -->
  <script src="js/config.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/music.js"></script>
  <!-- Online scores: config is generated/gitignored; the game runs fine without it -->
  <script src="js/firebase-config.js" onerror="window.FIREBASE_CONFIG = null"></script>
  <script src="js/online/player.js"></script>
  <script src="js/online/scores.js"></script>
  <script src="js/views/BackView.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
